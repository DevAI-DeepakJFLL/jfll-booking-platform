name: Deploy to AWS (Serverless S3, CloudFront & Lambda)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'production-deploy'
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB 1: Deploy Backend API to AWS Lambda (Serverless)
  # =========================================================================
  deploy-backend:
    name: Deploy Backend to AWS Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        id: aws-auth
        env:
          SECRET_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "=== Checking AWS Credentials Configuration ==="
          KEY_ID="${SECRET_KEY_ID:-${{ vars.AWS_ACCESS_KEY_ID }}}"
          SEC_KEY="${SECRET_KEY:-${{ vars.AWS_SECRET_ACCESS_KEY }}}"
          REGION="${{ vars.AWS_REGION || 'ap-south-1' }}"

          if [ -z "$KEY_ID" ] || [ -z "$SEC_KEY" ]; then
            echo "::error::AWS credentials not found! Please ensure AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are added to GitHub (Repository Settings -> Secrets and variables -> Actions -> Secrets)."
            echo "Status: AWS_ACCESS_KEY_ID is $([ -n "$KEY_ID" ] && echo 'PRESENT' || echo 'MISSING')"
            echo "Status: AWS_SECRET_ACCESS_KEY is $([ -n "$SEC_KEY" ] && echo 'PRESENT' || echo 'MISSING')"
            exit 1
          fi

          echo "Configuring AWS credentials..."
          aws configure set aws_access_key_id "$KEY_ID"
          aws configure set aws_secret_access_key "$SEC_KEY"
          aws configure set default.region "$REGION"
          echo "AWS credentials configured successfully for region $REGION."

      - name: Package Backend Code
        run: |
          cd server
          zip -r ../lambda-bundle.zip lambda.mjs lib data/CONSOLIDATED_AIR_FREIGHT_RATES.csv package.json
          cd ..

      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.AWS_LAMBDA_FUNCTION_NAME || 'jfll-booking-api' }} \
            --zip-file fileb://lambda-bundle.zip

  # =========================================================================
  # JOB 2: Build & Deploy Frontend to S3 + CloudFront
  # =========================================================================
  deploy-frontend:
    name: Build & Deploy Frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configure AWS Credentials
        id: aws-auth
        env:
          SECRET_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          KEY_ID="${SECRET_KEY_ID:-${{ vars.AWS_ACCESS_KEY_ID }}}"
          SEC_KEY="${SECRET_KEY:-${{ vars.AWS_SECRET_ACCESS_KEY }}}"
          REGION="${{ vars.AWS_REGION || 'ap-south-1' }}"

          if [ -z "$KEY_ID" ] || [ -z "$SEC_KEY" ]; then
            echo "::error::AWS credentials missing."
            exit 1
          fi

          aws configure set aws_access_key_id "$KEY_ID"
          aws configure set aws_secret_access_key "$SEC_KEY"
          aws configure set default.region "$REGION"

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run TypeScript Typecheck
        working-directory: ./client
        run: pnpm run typecheck

      - name: Build Next.js Production Bundle
        working-directory: ./client
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: pnpm run build

      - name: Sync Static Assets to S3
        run: |
          # Sync immutable hashed JS/CSS assets
          aws s3 sync client/out s3://${{ vars.AWS_S3_BUCKET_NAME }} --delete --exclude "*.html" --cache-control "public, max-age=31536000, immutable"
          # Sync HTML and root documents with no-cache so updates are immediately visible
          aws s3 sync client/out s3://${{ vars.AWS_S3_BUCKET_NAME }} --delete --include "*.html" --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront CDN Cache
        run: |
          if [ -n "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
              --paths "/*"
          else
            echo "AWS_CLOUDFRONT_DISTRIBUTION_ID is not configured, skipping cache invalidation."
          fi
          else
            echo "AWS_CLOUDFRONT_DISTRIBUTION_ID is not configured, skipping cache invalidation."
          fi
